name: CD

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build Python distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Package local review UI
        run: tar -czf "coordy-review-ui-${GITHUB_REF_NAME}.tar.gz" -C web incident-review
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coordy-${{ github.ref_name }}
          path: |
            dist/*
            coordy-review-ui-${{ github.ref_name }}.tar.gz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            "coordy-review-ui-${GITHUB_REF_NAME}.tar.gz" \
            --verify-tag \
            --generate-notes
