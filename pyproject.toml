[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coordy"
version = "0.1.0"
description = "A local, reproducible harness for testing agent state drift and cross-session invalidation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Alex Jiang"}]
dependencies = []

[project.scripts]
coordy = "coordy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
